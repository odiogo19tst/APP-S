plugins { id 'com.android.application' }
android {
    namespace 'com.dodigital.dolive'
    compileSdk 35
    defaultConfig {
        applicationId 'com.dodigital.dolive'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-obs-editor'
    }
    buildTypes {
        release { minifyEnabled false }
        debug { debuggable true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
