plugins { id 'com.android.application' }
android {
    namespace 'br.com.doapps.grauelive'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.dodigital.copilotoxps'
        minSdk 26
        targetSdk 35
        versionCode 46
        versionName '1.30.1-repertorio-fix'
    }
    buildTypes { debug { signingConfig null } } // Releases are signed with the permanent private key after CI.
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'com.google.mediapipe:tasks-genai:0.10.27' }
