plugins { id 'com.android.application' }
android {
    namespace 'br.com.doapps.grauelive'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.dodigital.copilotoxps'
        minSdk 26
        targetSdk 35
        versionCode 98
        versionName '1.36.8-louve-token-staging'
    }
    buildTypes {
        debug {
            // Separate from the official release: no data or signing-key conflicts.
            applicationIdSuffix '.louvepreview'
            versionNameSuffix '-test'
            signingConfig signingConfigs.debug
        }
    } // Official APK still requires the permanent release signing key.
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'com.google.mediapipe:tasks-genai:0.10.27' }
