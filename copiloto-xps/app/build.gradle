plugins { id 'com.android.application' }
android {
    namespace 'br.com.doapps.grauelive'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.dodigital.copilotoxps'
        minSdk 26
        targetSdk 35
        versionCode 97
        versionName '1.36.7-direct-patch-midi'
    }
    buildTypes {
        debug {
            applicationIdSuffix '.patchmode'
            versionNameSuffix '-preview'
            signingConfig signingConfigs.debug
        }
    } // The production build still uses the permanent release signing key.
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'com.google.mediapipe:tasks-genai:0.10.27' }
