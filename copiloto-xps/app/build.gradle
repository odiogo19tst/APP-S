plugins { id 'com.android.application' }
android {
    namespace 'br.com.doapps.grauelive'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.dodigital.copilotoxps'
        minSdk 26
        targetSdk 35
        versionCode 96
        versionName '1.36.6-xps-safe-tone-switch'
    }
    buildTypes {
        debug {
            // Separate installable test app: never replaces official settings or release signature.
            applicationIdSuffix '.tonefix'
            versionNameSuffix '-preview'
            signingConfig signingConfigs.debug
        }
    } // Official release stays signed only by the permanent release key.
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'com.google.mediapipe:tasks-genai:0.10.27' }
