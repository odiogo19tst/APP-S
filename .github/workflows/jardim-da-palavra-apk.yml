name: Jardim da Palavra - APK teste
on:
  push:
    branches: [jardim-apk-dev]
  workflow_dispatch:
jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar codigo Android
        run: |
          mkdir -p jardim-da-palavra
          unzip -q jardim-da-palavra/fontes.zip -d jardim-da-palavra
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar instalacao independente da versao antiga
        working-directory: jardim-da-palavra
        run: |
          set -e
          sed -i "s/applicationIdSuffix '.dev'/applicationIdSuffix '.dora153'/" app/build.gradle
          sed -i "s/versionCode 152/versionCode 153/" app/build.gradle
          sed -i "s/versionName '1.5.2-dev'/versionName '1.5.3-teste'/" app/build.gradle
          sed -i 's/android:label="Jardim da Palavra"/android:label="Jardim Dora Teste"/' app/src/main/AndroidManifest.xml
          grep -E 'applicationIdSuffix|versionCode|versionName' app/build.gradle
      - name: Compilar APK
        working-directory: jardim-da-palavra
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Conferir assinatura e integridade do APK
        working-directory: jardim-da-palavra
        run: |
          set -e
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: Jardim-da-Palavra-APK-debug
          path: jardim-da-palavra/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
