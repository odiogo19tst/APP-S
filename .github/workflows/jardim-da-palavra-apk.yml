name: Jardim da Palavra - Revisao final 1.6.3
on:
  push:
    branches: [jardim-apk-dev]
  workflow_dispatch:
jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar codigo Android
        run: |
          mkdir -p jardim-da-palavra
          unzip -q jardim-da-palavra/fontes.zip -d jardim-da-palavra
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validar versao e identificador do curso
        working-directory: jardim-da-palavra
        run: |
          set -e
          grep -F "versionCode 163" app/build.gradle
          grep -F "applicationIdSuffix '.curso163'" app/build.gradle
          grep -F 'android:label="Jardim da Palavra Rev."' app/src/main/AndroidManifest.xml
          test -s app/src/main/assets/curso_data.js
          test -s app/src/main/assets/curso_ui.js
      - name: Executar testes de regressao de conteudo e interface
        working-directory: jardim-da-palavra
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/curso_ui.js
          node test_v162.js
          node test_app_v162.js
          node test_deep.js
      - name: Compilar APK
        working-directory: jardim-da-palavra
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Conferir assinatura e integridade do APK
        working-directory: jardim-da-palavra
        run: |
          set -e
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: Jardim-da-Palavra-1.6.3-Auditado-APK
          path: jardim-da-palavra/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
