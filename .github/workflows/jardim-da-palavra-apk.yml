name: Jardim da Palavra - Revisao final e Dedicatoria 1.6.13
on:
  push:
    branches: [jardim-apk-dev]
  workflow_dispatch:
jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar codigo Android
        run: |
          mkdir -p jardim-da-palavra
          unzip -q jardim-da-palavra/fontes.zip -d jardim-da-palavra
      - name: Validar indice da Harpa Crista atualizado
        run: |
          node -e "global.window={};require('./jardim-da-palavra/app/src/main/assets/harpa_index.js');if(window.JARDIM_HARPA_TITLES.length!==641||window.JARDIM_HARPA_TITLES[40]!=='A Cidade do Bom Deus')process.exit(2);console.log('640 titulos e revisao confirmados')"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validar versao e identificador do curso
        working-directory: jardim-da-palavra
        run: |
          set -e
          grep -F "versionCode 173" app/build.gradle
          grep -F "applicationIdSuffix '.harpa172'" app/build.gradle
          grep -F 'android:label="Jardim da Palavra"' app/src/main/AndroidManifest.xml
          test -s app/src/main/assets/curso_data.js
          test -s app/src/main/assets/curso_ui.js
          test -s app/src/main/assets/harpa_letras.js
          test -s app/src/main/assets/seminarios.js
          test -s app/src/main/assets/seminarios_ui.js
          test -s app/src/main/java/com/diogo/jardimbibliaseestudos/AcfStorage.java
          grep -F 'BACKUP_EXPORT_PICKER' app/src/main/java/com/diogo/jardimbibliaseestudos/MainActivity.java
      - name: Executar testes de regressao de conteudo e interface
        working-directory: jardim-da-palavra
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/curso_ui.js
          node test_v162.js
          node test_app_v162.js
          node test_deep.js
          node test_dev_v164.js
          node test_acf_offline.js
          node test_assistente_166.js
          node test_backup_167.js
          node test_harpa_171.js
          node test_harpa_172.js
          node test_173.js
          node --check app/src/main/assets/seminarios.js
          node --check app/src/main/assets/seminarios_ui.js
      - name: Compilar APK
        working-directory: jardim-da-palavra
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Conferir assinatura e integridade do APK
        working-directory: jardim-da-palavra
        run: |
          set -e
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: Jardim-1.6.13-Revisado-Dedicatoria-Base-APK
          path: jardim-da-palavra/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Separar ferramentas de assinatura para pacote pessoal
        run: |
          set -e
          mkdir -p sign-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" sign-tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" sign-tools/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Signing-Tools-Linux
          path: sign-tools/*
          if-no-files-found: error
          retention-days: 7
